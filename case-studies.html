document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

              <div style=\"display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 6px 8px; padding: 22px 0; border-bottom: 1px solid var(--border-subtle);\">\n                <span style=\"font-size: 13px; line-height: 26px; color: var(--text-muted);\">{{ f.index }}<\u002Fspan>\n                <div style=\"display: flex; flex-direction: column; gap: 6px;\">\n                  <span style=\"font-size: 18px; line-height: 26px; font-weight: 500; color: var(--text-strong);\">{{ f.title }}<\u002Fspan>\n                  <span style=\"font-size: 15px; line-height: 1.55; color: var(--text-body);\">{{ f.body }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"margin-top: clamp(64px, 8vw, 112px); background: var(--nova-ink-50); border-radius: 28px; padding: clamp(20px, 3vw, 40px);\">\n          <div style=\"display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 24px; margin-bottom: 28px;\">\n            <span style=\"font-size: var(--fs-title); font-weight: 500; color: var(--text-strong);\">Screens<\u002Fspan>\n            <span style=\"font-size: 14px; color: var(--text-muted);\">{{ p.screensNote }}<\u002Fspan>\n          <\u002Fdiv>\n          <div data-a=\"stagger\" style=\"display: grid; grid-template-columns: {{ p.galleryCols }}; gap: clamp(12px, 2vw, 24px);\">\n            <sc-for list=\"{{ p.screens }}\" as=\"sc\" hint-placeholder-count=\"4\">\n              <figure style=\"margin: 0; display: flex; flex-direction: column; gap: 12px;\">\n                <div style=\"aspect-ratio: 9 / 19.5; border-radius: 24px; overflow: hidden; background: var(--nova-ink-200); box-shadow: var(--shadow-lg);\">\n                  <div role=\"img\" aria-label=\"{{ sc.label }}\" style=\"width: 100%; height: 100%; background-image: {{ sc.bg }}; background-size: cover; background-position: top center;\"><\u002Fdiv>\n                <\u002Fdiv>\n                <figcaption style=\"font-size: 13px; color: var(--text-muted); text-align: center;\">{{ sc.label }}<\u002Ffigcaption>\n              <\u002Ffigure>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div data-a=\"up\" style=\"margin-top: clamp(48px, 6vw, 72px); display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 20px;\">\n          <x-import component-from-global-scope=\"NovaDesignSystem_12d8c3.Button\" variant=\"primary\" icon=\"arrow-up-right\" icon-style=\"inline\" on-click=\"{{ openUpwork }}\" hint-size=\"250px,48px\">Build Something Like This<\u002Fx-import>\n          <a href=\"#{{ p.nextId }}\" sc-camel-on-click=\"{{ p.jumpNext }}\" style=\"display: inline-flex; align-items: center; gap: 14px; text-decoration: none; color: var(--text-strong);\">\n            <span style=\"display: flex; flex-direction: column; align-items: flex-end; gap: 2px;\">\n              <span style=\"font-size: 13px; color: var(--text-muted);\">{{ p.nextLabel }}<\u002Fspan>\n              <span style=\"font-size: var(--fs-title); font-weight: 500;\">{{ p.nextName }}<\u002Fspan>\n            <\u002Fspan>\n            <span style=\"width: 44px; height: 44px; border-radius: 50%; background: var(--nova-ink-950); color: #fff; display: grid; place-items: center; font-size: 18px;\">→<\u002Fspan>\n          <\u002Fa>\n        <\u002Fdiv>\n      <\u002Farticle>\n    <\u002Fsc-for>\n\n    <section id=\"contact\" data-screen-label=\"Contact\" data-a=\"band\" style=\"background: var(--surface-inverse); color: #fff; padding: clamp(104px, 13vw, 176px) clamp(20px, 7vw, 112px) 40px;\">\n      <div data-a=\"stagger\" style=\"display: flex; flex-direction: column; align-items: center; text-align: center; gap: 32px;\">\n        <div style=\"font-size: 14px; color: var(--nova-lime-300);\">Let's Build Something Better<\u002Fdiv>\n        <h2 style=\"margin: 0; font-size: clamp(48px, 7vw, 88px); line-height: var(--lh-display); letter-spacing: var(--ls-display); font-weight: 600; text-transform: uppercase;\"><span style=\"display: block;\">Have a Mobile<\u002Fspan><span style=\"color: var(--nova-ink-400);\">App in Mind?<\u002Fspan><\u002Fh2>\n        <p style=\"margin: 0; max-width: 540px; font-size: 18px; line-height: 1.6; color: var(--text-on-inverse-muted); text-wrap: pretty;\">Whether you're building a new application or improving an existing product, let's discuss what you're working on.<\u002Fp>\n        <div style=\"display: flex; flex-wrap: wrap; justify-content: center; gap: 12px;\">\n          <x-import component-from-global-scope=\"NovaDesignSystem_12d8c3.Button\" variant=\"accent\" size=\"lg\" icon=\"arrow-up-right\" on-click=\"{{ openUpwork }}\" hint-size=\"250px,56px\">Hire Me on Upwork<\u002Fx-import>\n        <\u002Fdiv>\n        <p style=\"margin: 0; font-size: 13px; color: var(--text-on-inverse-muted);\">No commitment. Just send me a message on Upwork and I'll get back to you within a day.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display: flex; flex-wrap: wrap; justify-content: space-between; gap: 16px; margin-top: clamp(96px, 12vw, 152px); padding-top: 28px; border-top: 1px solid var(--border-inverse); font-size: 14px; color: var(--text-on-inverse-muted);\">\n        <a href=\"index.html\" style=\"font-size: 18px; font-weight: 700; letter-spacing: -0.03em; color: #fff; text-decoration: none;\">Hafid<\u002Fa>\n        <span>Mobile App Developer · Flutter &amp; React Native · AI-Powered Apps<\u002Fspan>\n        <span>© 2026 Hafid<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fsection>\n  <\u002Fmain>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nconst UPWORK = 'https://www.upwork.com/freelancers/~01afd64408621677da';\nconst PROJECTS = [\n  {\n    id: 'pixel-pocket', name: 'Pixel-Pocket', tagline: 'Finance, offline.', number: '01', category: 'Personal Finance',\n    cover: 'assets/projects/pixel-pocket/cover.png',\n    meta: [{ k: 'Platform', v: 'iOS & Android' }, { k: 'Type', v: 'Offline-first finance app' }, { k: 'Architecture', v: '8 feature modules, zero backend' }, { k: 'Sync', v: 'Opt-in Google Sheets backup' }],\n    story: [\n      { label: 'The Problem', body: 'Most budgeting apps need an account and a server just to track your spending. Your money data sits in someone else’s cloud, and the app slows down or breaks when you’re offline.' },\n      { label: 'The Approach', body: 'Make the phone the source of truth. All data lives in an embedded SQLite database, so every screen loads instantly and works without a signal. There is no server to run or maintain.' },\n      { label: 'The Result', body: 'A fast, private finance app with a terminal-inspired interface. Sync is opt-in: users back up to their own Google Sheets in the background, without blocking the UI.' }\n    ],\n    headline: 'Private by default.', headlineMuted: 'Your data stays on your device unless you choose to sync it.',\n    stats: [{ value: '0', label: 'Backend servers' }, { value: '8', label: 'Feature modules' }, { value: '100%', label: 'On-device storage' }],\n    stack: ['Flutter', 'Drift (SQLite)', 'Riverpod', 'fl_chart', 'Google Sheets API v4'],\n    features: [\n      { title: 'PIN lock & balance masking', body: 'A 4-digit PIN guards the app on launch, and balances can be hidden with one tap in public.' },\n      { title: 'Multi-account balances', body: 'Banks, e-wallets and cash in one list, with a running total across every account.' },\n      { title: 'Salary-period budgeting', body: 'Budgets follow your payday rather than the calendar month, with a live “spent” progress bar.' },\n      { title: 'Charts by week, month & year', body: 'Income vs. expense trends and spending by category, rendered with fl_chart.' },\n      { title: 'Background Google Sheets backup', body: 'Optional sync to a sheet the user owns. It runs in the background so the UI never waits on the network.' }\n    ],\n    screensNote: 'Terminal-inspired dark UI',\n    screens: [{ src: 'assets/projects/pixel-pocket/unlock.png', label: 'PIN unlock' }, { src: 'assets/projects/pixel-pocket/dashboard.png', label: 'Dashboard' }, { src: 'assets/projects/pixel-pocket/transactions.png', label: 'Transactions' }, { src: 'assets/projects/pixel-pocket/chart.png', label: 'Charts' }, { src: 'assets/projects/pixel-pocket/settings.png', label: 'Settings' }]\n  },\n  {\n    id: 'repmind', name: 'RepMind', tagline: 'AI workout planner.', number: '02', category: 'Health & Fitness · AI',\n    cover: 'assets/projects/repmind/cover.png',\n    meta: [{ k: 'Platform', v: 'iOS & Android' }, { k: 'AI', v: 'Google Gemini' }, { k: 'Backend', v: 'Supabase' }, { k: 'Quality', v: '300+ tests · CI with GitHub Actions' }],\n    story: [\n      { label: 'The Problem', body: 'Generic workout templates ignore your equipment, schedule and level. Personal coaching adapts, but it’s expensive and hard to fit into a week.' },\n      { label: 'The Approach', body: 'Users set a goal, level, equipment and training days, and Gemini builds a weekly plan. They can revise it in plain language, and every version is kept so they can always go back.' },\n      { label: 'The Result', body: 'A coach in your pocket: structured daily sessions with sets, reps and rest, a chat coach that knows your plan, and weekly progress that keeps you consistent.' }\n    ],\n    headline: 'AI that plans, not just chats.', headlineMuted: 'Every answer is grounded in the user’s goal, equipment and current plan version.',\n    stats: [{ value: '300+', label: 'Automated tests' }, { value: '2', label: 'Platforms' }, { value: 'v1→vN', label: 'Versioned plans' }],\n    stack: ['Flutter', 'Supabase', 'Google Gemini', 'Riverpod 3', 'GitHub Actions'],\n    features: [\n      { title: 'Goal-based plan generation', body: 'Gemini picks exercises for your equipment and builds a schedule around your training days.' },\n      { title: 'Versioned plans', body: 'Revise the plan in plain language. Each revision is saved as a new version, so nothing is lost.' },\n      { title: 'Context-aware AI coach', body: 'Ask “my shoulder feels tight” and the coach suggests safe swaps for today’s session.' },\n      { title: 'Daily session detail', body: 'Every exercise comes with target muscle, equipment, sets × reps and rest time.' },\n      { title: 'Weekly progress & streaks', body: 'Track completed days and get coach tips based on how the last session went.' }\n    ],\n    screensNote: 'Bold, high-energy UI',\n    screens: [{ src: 'assets/projects/repmind/home.png', label: 'Home' }, { src: 'assets/projects/repmind/generating.png', label: 'Generating plan' }, { src: 'assets/projects/repmind/plan.png', label: 'Weekly plan' }, { src: 'assets/projects/repmind/day.png', label: 'Day detail' }]\n  },\n  {\n    id: 'voltry', name: 'Voltry', tagline: 'AI food analyzer.', number: '03', category: 'Nutrition · AI Vision',\n    cover: 'assets/projects/voltry/cover.png',\n    meta: [{ k: 'Platform', v: 'iOS & Android' }, { k: 'AI', v: 'Firebase AI Logic (Gemini)' }, { k: 'Data', v: 'Cloud Firestore · Google Sign-In' }, { k: 'Quality', v: '187 tests' }],\n    story: [\n      { label: 'The Problem', body: 'Manual calorie logging is tedious: search a database, guess the portion, enter every ingredient. Most people give up within a week.' },\n      { label: 'The Approach', body: 'Replace typing with one photo. Gemini estimates the meal’s name, calories, protein, carbs and fat, and the user just confirms and saves.' },\n      { label: 'The Result', body: 'Logging takes seconds. Meal history and the daily calorie target sync per account, and saving still works offline.' }\n    ],\n    headline: 'One photo, full macros.', headlineMuted: 'Logging a meal goes from minutes of typing to a single tap.',\n    stats: [{ value: '187', label: 'Automated tests' }, { value: '1', label: 'Photo per meal' }, { value: '4', label: 'Nutrients estimated' }],\n    stack: ['Flutter', 'Firebase AI Logic (Gemini)', 'Cloud Firestore', 'Google Sign-In', 'Riverpod 3'],\n    features: [\n      { title: 'Snap-to-estimate', body: 'Take a photo and get an AI estimate of the dish name, kcal, protein, carbs and fat.' },\n      { title: 'Daily calorie target', body: 'A progress ring shows how much of today’s target is used, with an editable daily goal.' },\n      { title: 'Meal history by day', body: 'Meals are grouped by day with daily totals and photo thumbnails.' },\n      { title: 'Offline-safe saving', body: 'Saves are queued locally and sync to Firestore when the connection returns.' },\n      { title: 'Google Sign-In & model picker', body: 'One-tap sign-in keeps data per account, and users can switch Gemini models.' }\n    ],\n    screensNote: 'Warm, friendly UI',\n    screens: [{ src: 'assets/projects/voltry/sign-in.jpg', label: 'Sign in' }, { src: 'assets/projects/voltry/home.jpg', label: 'Today' }, { src: 'assets/projects/voltry/analyze.jpg', label: 'AI estimate' }, { src: 'assets/projects/voltry/history.jpg', label: 'History' }]\n  }\n];\n\nclass Component extends DCLogic {\n  state = { open: false, sent: false, active: '', w: typeof window !== 'undefined' ? window.innerWidth : 1280 };\n\n  componentDidMount() {\n    this.onResize = () => this.setState({ w: window.innerWidth });\n    window.addEventListener('resize', this.onResize);\n    this.tries = 0;\n    this.timer = setTimeout(() => this.initMotion(), 400);\n    if (location.hash) setTimeout(() => this.jump(location.hash.slice(1)), 900);\n  }\n  componentWillUnmount() {\n    window.removeEventListener('resize', this.onResize);\n    clearTimeout(this.timer);\n    if (this.ctx) this.ctx.revert();\n  }\n  componentDidUpdate(_, prev) {\n    if (prev.w !== this.state.w && window.ScrollTrigger) window.ScrollTrigger.refresh();\n  }\n\n  initMotion() {\n    const gsap = window.gsap, ST = window.ScrollTrigger;\n    if (!gsap || !ST || !document.querySelector('[data-a=\"cover\"]')) {\n      if (this.tries++ < 40) this.timer = setTimeout(() => this.initMotion(), 150);\n      return;\n    }\n    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;\n    gsap.registerPlugin(ST);\n    const ease = 'power3.out';\n    this.ctx = gsap.context(() => {\n      gsap.timeline({ defaults: { ease } })\n        .from('[data-a=\"nav\"]', { y: -16, autoAlpha: 0, duration: 0.6 })\n        .from('[data-a=\"line\"]', { yPercent: 110, duration: 1, stagger: 0.12 }, 0.1)\n        .from('[data-a=\"hero-in\"]', { y: 24, autoAlpha: 0, duration: 0.8, stagger: 0.08 }, 0.4);\n      gsap.utils.toArray('[data-a=\"up\"]').forEach(el => {\n        gsap.from(el, { y: 56, autoAlpha: 0, duration: 1, ease, scrollTrigger: { trigger: el, start: 'top 88%', once: true } });\n      });\n      gsap.utils.toArray('[data-a=\"stagger\"]').forEach(el => {\n        gsap.from(el.children, { y: 48, autoAlpha: 0, duration: 0.9, ease, stagger: 0.08, scrollTrigger: { trigger: el, start: 'top 88%', once: true } });\n      });\n      gsap.utils.toArray('[data-a=\"cover\"]').forEach(el => {\n        gsap.fromTo(el, { clipPath: 'inset(6% 6% round 28px)' }, { clipPath: 'inset(0% 0% round 28px)', ease: 'none', scrollTrigger: { trigger: el, start: 'top 95%', end: 'top 30%', scrub: true } });\n        const img = el.querySelector('[data-a=\"cover-img\"]');\n        if (img) gsap.fromTo(img, { scale: 1.12 }, { scale: 1, ease: 'none', scrollTrigger: { trigger: el, start: 'top bottom', end: 'bottom top', scrub: true } });\n      });\n      gsap.utils.toArray('[data-a=\"band\"]').forEach(el => {\n        gsap.fromTo(el, { clipPath: 'inset(0% 4% round 28px)' }, { clipPath: 'inset(0% 0% round 0px)', ease: 'none', scrollTrigger: { trigger: el, start: 'top 95%', end: 'top 35%', scrub: true } });\n      });\n    });\n    window.addEventListener('load', () => ST.refresh(), { once: true });\n    setTimeout(() => ST.refresh(), 1200);\n  }\n\n  jump = (id) => {\n    const el = document.getElementById(id);\n    if (el) window.scrollTo({ top: el.getBoundingClientRect().top + window.scrollY - 16, behavior: 'smooth' });\n  };\n\n  go = (l) => {\n    if (l === 'Home') { window.location.href = 'index.html'; return; }\n    const p = PROJECTS.find(x => x.name === l);\n    this.setState({ active: l });\n    if (p) this.jump(p.id);\n  };\n\n  layout() {\n    const w = this.state.w;\n    if (w >= 1100) return { h1: 'clamp(52px, 7vw, 88px)', h2: 'clamp(44px, 5.5vw, 72px)', bp: 'lg', split: 'minmax(0,7fr) minmax(0,5fr)', three: 'repeat(3, minmax(0,1fr))' };\n    if (w >= 720) return { h1: '64px', h2: '52px', bp: 'md', split: 'minmax(0,1fr)', three: 'repeat(3, minmax(0,1fr))' };\n    return { h1: '48px', h2: '34px', bp: 'sm', split: 'minmax(0,1fr)', three: 'minmax(0,1fr)' };\n  }\n\n  renderVals() {\n    const L = this.layout();\n    const projects = PROJECTS.map((p, i) => {\n      const next = PROJECTS[(i + 1) % PROJECTS.length];\n      const n = p.screens.length;\n      const cols = L.bp === 'lg' ? n : L.bp === 'md' ? (n === 4 ? 4 : 3) : 2;\n      return {\n        ...p,\n        bg: \"url('\" + p.cover + \"')\",\n        screens: p.screens.map(s => ({ ...s, bg: \"url('\" + s.src + \"')\" })),\n        features: p.features.map((f, j) => ({ ...f, index: String(j + 1).padStart(2, '0') })),\n        galleryCols: 'repeat(' + cols + ', minmax(0,1fr))',\n        nextId: next.id, nextName: next.name, nextLabel: i === PROJECTS.length - 1 ? 'Back to first project' : 'Next project',\n        jump: (e) => { e.preventDefault(); this.jump(p.id); },\n        jumpNext: (e) => { e.preventDefault(); this.jump(next.id); }\n      };\n    });\n    return {\n      L,\n      projects,\n      navLinks: L.bp === 'sm' ? ['Home'] : ['Home', 'Pixel-Pocket', 'RepMind', 'Voltry'],\n      active: this.state.active,\n      go: this.go,\n      open: this.state.open,\n      sent: this.state.sent,\n      notSent: !this.state.sent,\n      dialogTitle: this.state.sent ? 'Thanks, talk soon.' : 'Tell me about your app',\n      openBrief: () => this.setState({ open: true }),\n      closeBrief: () => this.setState({ open: false, sent: false }),\n      send: () => this.setState({ sent: true }),\n      openUpwork: () => (window.gtag && window.gtag('event', 'upwork_click', { link_url: 'upwork_profile', page_path: location.pathname }), window.open(UPWORK, '_blank', 'noopener'))\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
